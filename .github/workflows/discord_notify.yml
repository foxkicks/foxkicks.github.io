name: Discord Post Notify
on:
  push:
    branches:
      - main
    paths:
      - '_posts/**'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Necessary to compare the last two commits

      - name: Get Post Info and Notify
        run: |
          # 1. Identify the new file in _posts
          NEW_POST=$(git diff --name-only HEAD^ HEAD | grep '_posts/' | head -n 1)
          
          # 2. Extract the date and title from filename (e.g., 2023-10-27-hello-world.md)
          # This removes the path and the .md extension
          FILENAME=$(basename "$NEW_POST" .md)
          
          # 3. Chirpy URLs usually strip the date: /posts/hello-world/
          # We extract everything after the third hyphen
          SLUG=$(echo $FILENAME | cut -d'-' -f4-)
          
          # 4. Construct the Final URL (Replace with your actual domain)
          FINAL_URL="https://foxkicks.github.io/posts/$SLUG/"
          
          # 5. Send to Discord via CURL
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{\"content\": \"**New Post from FoxKicks!**\n\nCheckout the latest update: **$SLUG**\nRead more here: $FINAL_URL\"}" \
               ${{ secrets.DISCORD_WEBHOOK }}
